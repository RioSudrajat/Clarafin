name: clarafin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarafin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarafin_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-clarafin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clarafin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clarafin} -d ${POSTGRES_DB:-clarafin}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - clarafin_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: ${HTTP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-true}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-clarafin_dev_only_hs256_secret_min_32_chars}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # Inside the Docker network, api connects to postgres and redis service names
      # rather than host-facing localhost URLs from .env.local.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-clarafin}:${POSTGRES_PASSWORD:-clarafin_dev_password}@postgres:5432/${POSTGRES_DB:-clarafin}?sslmode=disable}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_RATE_LIMIT_PER_MIN: ${AI_RATE_LIMIT_PER_MIN:-10}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${HTTP_PORT:-8080}/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  clarafin_postgres_data:
  clarafin_redis_data:
